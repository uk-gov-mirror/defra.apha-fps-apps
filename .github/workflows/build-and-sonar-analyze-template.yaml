name: build and sonar analyze template
on:
  workflow_call:
     inputs:
       dotnet_application_solution_name:
         description: >
           Base name/namespace prefix of the solution (i.e. the folder name under src/).
           E.g. 'Apha.FPS', 'Apha.Costbook', 'Apha.PACT', 'Apha.PIMS', 'Apha.FPSApps'.
         required: true
         type: string
       sonar_project_key:
         description: >
           The exact SonarCloud project key to report analysis results to.
           Must match an existing project in SonarCloud (visible in project URL: ?id=<key>).
           E.g. 'DEFRA_apha-fps-apps'.
         required: true
         type: string
       solution_file:
         description: >
           The .sln filename (without the .sln extension) located inside the solution folder.
           E.g. 'Apha.FPS.Api', 'Apha.Costbook.Api', 'Apha.FPSApps.Web'.
         required: true
         type: string
       run_application_tests:
         description: "Run Application layer unit tests (requires <SolutionName>.Application.UnitTests project)"
         required: false
         type: boolean
         default: true
       run_web_tests:
         description: "Run Web/UI layer unit tests (requires <SolutionName>.<web_layer_suffix>.UnitTests project)"
         required: true
         type: boolean
         default: true
       web_layer_suffix:
         description: >
           The folder/namespace suffix for the web/api layer unit tests.
           E.g. 'Web' for Apha.FPSApp, 'Api' for Apha.FPS.
         required: false
         type: string
         default: 'Web'
       run_dataaccess_tests:
         description: "Run DataAccess layer unit tests for Backend Services Only (requires <SolutionName>.DataAccess.UnitTests project)"
         required: false
         type: boolean
         default: false
       dataaccess_test_filter:
         description: "Optional dotnet test filter expression for the DataAccess test project (for example to skip Postgres-dependent integration tests in CI, which has no Postgres service)"
         required: false
         type: string
         default: ''
       run_infrastructure_tests:
         description: "Run Infrastructure layer unit tests for FrontEnd Only (requires <SolutionName>.Infrastructure.UnitTests project)"
         required: false
         type: boolean
         default: false
       run_custom_tests:
         description: "Run a custom unit test project path for non-standard solution layouts"
         required: false
         type: boolean
         default: false
       custom_test_filter:
         description: "Optional dotnet test filter expression for custom tests (for example to skip integration tests in CI)"
         required: false
         type: string
         default: ''

     secrets:
       SONAR_TOKEN:
         required: true

jobs:
  build-and-sonar-analyze:
    name: build-and-sonar-analyze
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      should_push: ${{ steps.check_commit.outputs.should_push }}
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Extract short SHA
        id: shortsha
        shell: bash
        run: |
          echo "shortsha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Check last commit message for 'ecrpush'
        id: check_commit
        shell: bash
        run: |
          COMMIT_MSG="$(git log -1 --pretty=%B)"
          echo "Last commit message: $COMMIT_MSG"
          if [[ "$COMMIT_MSG" == *"ecrpush"* ]]; then
            echo "should_push=true"
            echo "should_push=true" >> $GITHUB_OUTPUT
          else
            echo "should_push=false"
            echo "should_push=false" >> $GITHUB_OUTPUT
          fi

      - name: Start Sonar Analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ inputs.sonar_project_key }}
          SONAR_VERSION: ${{ steps.shortsha.outputs.shortsha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Using SonarQube Project Key: $SONAR_PROJECT_KEY"
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"defra" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /v:"$SONAR_VERSION" \
            /d:sonar.cs.opencover.reportsPaths="src/TestResults/*.coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="src/TestResults/*.test_results.trx" \
            /d:sonar.branch.name="$BRANCH_NAME" \
            /d:sonar.verbose=true \
            /d:sonar.exclusions="**/wwwroot/**" \
            /d:sonar.coverage.exclusions="**/wwwroot/**,**/*.cshtml,**/Interfaces/*.cs,**/*Map.cs,**/*Mapper.cs,**/Program.cs,**/Startup.cs,**/DTOs/*.cs,**/Entities/*.cs,**/Models/*.cs"

      - name: Restore NuGet packages
        shell: bash
        env:
          APP_SOLUTION_NAME: ${{ inputs.dotnet_application_solution_name }}
          SOLUTION_FILE: ${{ inputs.solution_file }}
        run: dotnet restore src/$APP_SOLUTION_NAME/$SOLUTION_FILE.sln

      - name: Build Solution
        shell: bash
        env:
          APP_SOLUTION_NAME: ${{ inputs.dotnet_application_solution_name }}
          SOLUTION_FILE: ${{ inputs.solution_file }}
        run: dotnet build src/$APP_SOLUTION_NAME/$SOLUTION_FILE.sln --configuration Release --no-restore -p:DebugType=full -p:DebugSymbols=true

      - name: Run Application Unit Tests with Coverage
        if: ${{ inputs.run_application_tests }}
        shell: bash
        env:
          APP_SOLUTION_NAME: ${{ inputs.dotnet_application_solution_name }}
        run: |
          dotnet test src/$APP_SOLUTION_NAME/$APP_SOLUTION_NAME.Application.UnitTests/$APP_SOLUTION_NAME.Application.UnitTests.csproj \
            --no-build --configuration Release \
            -p:CollectCoverage=true \
            -p:CoverletOutput=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.Application.coverage.opencover.xml \
            -p:CoverletOutputFormat=opencover \
            -p:Deterministic=true \
            --logger "trx;LogFileName=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.Application.test_results.trx"

      - name: Run Web Unit Tests with Coverage
        if: ${{ inputs.run_web_tests }}
        shell: bash
        env:
          APP_SOLUTION_NAME: ${{ inputs.dotnet_application_solution_name }}
          WEB_LAYER_SUFFIX: ${{ inputs.web_layer_suffix }}
        run: |
          dotnet test src/$APP_SOLUTION_NAME/$APP_SOLUTION_NAME.$WEB_LAYER_SUFFIX.UnitTests/$APP_SOLUTION_NAME.$WEB_LAYER_SUFFIX.UnitTests.csproj \
            --no-build --configuration Release \
            -p:CollectCoverage=true \
            -p:CoverletOutput=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.$WEB_LAYER_SUFFIX.coverage.opencover.xml \
            -p:CoverletOutputFormat=opencover \
            -p:Deterministic=true \
            --logger "trx;LogFileName=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.$WEB_LAYER_SUFFIX.test_results.trx"

      - name: Run DataAccess Unit Tests with Coverage
        if: ${{ inputs.run_dataaccess_tests }}
        shell: bash
        env:
          APP_SOLUTION_NAME: ${{ inputs.dotnet_application_solution_name }}
          DATAACCESS_TEST_FILTER: ${{ inputs.dataaccess_test_filter }}
        run: |
          FILTER_ARGS=()
          if [ -n "$DATAACCESS_TEST_FILTER" ]; then
            FILTER_ARGS+=(--filter "$DATAACCESS_TEST_FILTER")
          fi

          dotnet test src/$APP_SOLUTION_NAME/$APP_SOLUTION_NAME.DataAccess.UnitTests/$APP_SOLUTION_NAME.DataAccess.UnitTests.csproj \
            --no-build --configuration Release \
            "${FILTER_ARGS[@]}" \
            -p:CollectCoverage=true \
            -p:CoverletOutput=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.DataAccess.coverage.opencover.xml \
            -p:CoverletOutputFormat=opencover \
            -p:Deterministic=true \
            --logger "trx;LogFileName=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.DataAccess.test_results.trx"

      - name: Run Infrastructure Unit Tests with Coverage
        if: ${{ inputs.run_infrastructure_tests }}
        shell: bash
        env:
          APP_SOLUTION_NAME: ${{ inputs.dotnet_application_solution_name }}
        run: |
          dotnet test src/$APP_SOLUTION_NAME/$APP_SOLUTION_NAME.Infrastructure.UnitTests/$APP_SOLUTION_NAME.Infrastructure.UnitTests.csproj \
            --no-build --configuration Release \
            -p:CollectCoverage=true \
            -p:CoverletOutput=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.Infrastructure.coverage.opencover.xml \
            -p:CoverletOutputFormat=opencover \
            -p:Deterministic=true \
            --logger "trx;LogFileName=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.Infrastructure.test_results.trx"

      - name: Run Custom Unit Tests with Coverage
        if: ${{ inputs.run_custom_tests }}
        shell: bash
        env:
          APP_SOLUTION_NAME: ${{ inputs.dotnet_application_solution_name }}
          CUSTOM_TEST_FILTER: ${{ inputs.custom_test_filter }}
        run: |
          FILTER_ARGS=()
          if [ -n "$CUSTOM_TEST_FILTER" ]; then
            FILTER_ARGS+=(--filter "$CUSTOM_TEST_FILTER")
          fi

          dotnet test src/$APP_SOLUTION_NAME/$APP_SOLUTION_NAME.UnitTests/$APP_SOLUTION_NAME.UnitTests.csproj \
            --no-build --configuration Release \
            "${FILTER_ARGS[@]}" \
            -p:CollectCoverage=true \
            -p:CoverletOutput=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.coverage.opencover.xml \
            -p:CoverletOutputFormat=opencover \
            -p:Deterministic=true \
            --logger "trx;LogFileName=$(pwd)/src/TestResults/$APP_SOLUTION_NAME.test_results.trx"

      - name: List coverage files
        shell: bash
        run: |
          find . -name "*.coverage.opencover.xml"
          find . -name "*.test_results.trx"

      - name: End Sonar Analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"