# Liquibase configuration
# Note: When using command-line parameters, those override these values
# For local testing, use command-line args: --url, --username, --password

# url=${LB_JDBC_DB_URL}
# username=${LB_USER}
# password=${LB_PASSWORD}
driver=org.postgresql.Driver
# defaultSchemaName=${LB_DEFAULT_SCHEMA}

logLevel=severe
liquibase.sql.logLevel=FINE
show-summary=SUMMARY
searchPath=.
changeLogFile=liquibase/db.changelog-master.yaml
